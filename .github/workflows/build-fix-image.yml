name: Build fix image (arm64)

on:
  push:
    branches:
      - fix-podman-cpu-stats
  workflow_dispatch:

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply Podman precpu_stats fix
        run: python3 scripts/apply-podman-fix.py

      - name: Verify fix applied
        run: |
          grep -q "withSynthesizedPrecpu" src/lib/server/docker.ts || { echo "ERROR: fix not applied"; exit 1; }

      - name: Commit fix if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            git add src/lib/server/docker.ts
            git commit -m "fix(docker): synthesize precpu_stats from cached sample for Podman one-shot stats [skip ci]"
            git push
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/142bot/dockhand:fix-podman-cpu
          cache-from: type=gha
          cache-to: type=gha,mode=max
